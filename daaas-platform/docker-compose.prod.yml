version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Backend - Django API (Production)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: daaas-backend-prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - daaas-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ---------------------------------------------------------------------------
  # Frontend - Nginx serving static build
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: daaas-frontend-prod
    expose:
      - "80"
    restart: always
    networks:
      - daaas-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: daaas-nginx
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - daaas-network

  # ---------------------------------------------------------------------------
  # PostgreSQL (Production)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: daaas-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - daaas-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  # ---------------------------------------------------------------------------
  # Redis (Production)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: daaas-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - daaas-network

  # ---------------------------------------------------------------------------
  # Celery Worker (Production)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: daaas-celery-worker-prod
    command: celery -A config worker -l warning --concurrency=8 -Q default,ai,ml,reports
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    restart: always
    networks:
      - daaas-network
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

  # ---------------------------------------------------------------------------
  # Celery Beat (Production)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: daaas-celery-beat-prod
    command: celery -A config beat -l warning --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    restart: always
    networks:
      - daaas-network

volumes:
  postgres-data:
  redis-data:

networks:
  daaas-network:
    driver: bridge
