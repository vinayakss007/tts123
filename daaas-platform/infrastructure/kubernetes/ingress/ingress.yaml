apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daaas-ingress
  namespace: daaas
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/websocket-services: "daaas-backend"
spec:
  tls:
    - hosts:
        - app.daaas.io
        - api.daaas.io
      secretName: daaas-tls
  rules:
    - host: app.daaas.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: daaas-frontend
                port:
                  number: 80
    - host: api.daaas.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: daaas-backend
                port:
                  number: 8000
