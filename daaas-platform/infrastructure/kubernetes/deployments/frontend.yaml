apiVersion: apps/v1
kind: Deployment
metadata:
  name: daaas-frontend
  namespace: daaas
  labels:
    app: daaas
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: daaas
      component: frontend
  template:
    metadata:
      labels:
        app: daaas
        component: frontend
    spec:
      containers:
        - name: frontend
          image: daaas/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
