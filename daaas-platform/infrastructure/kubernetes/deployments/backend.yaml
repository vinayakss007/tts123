apiVersion: apps/v1
kind: Deployment
metadata:
  name: daaas-backend
  namespace: daaas
  labels:
    app: daaas
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: daaas
      component: backend
  template:
    metadata:
      labels:
        app: daaas
        component: backend
    spec:
      containers:
        - name: backend
          image: daaas/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: daaas-config
            - secretRef:
                name: daaas-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
