apiVersion: apps/v1
kind: Deployment
metadata:
  name: daaas-celery-worker
  namespace: daaas
  labels:
    app: daaas
    component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: daaas
      component: celery-worker
  template:
    metadata:
      labels:
        app: daaas
        component: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: daaas/backend:latest
          command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=4", "-Q", "default,ai,ml,reports"]
          envFrom:
            - configMapRef:
                name: daaas-config
            - secretRef:
                name: daaas-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
